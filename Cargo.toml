[workspace]
resolver = "2"
members = [
    "crates/r8-core",
    "crates/r8d",
    "crates/r8-gui",
]
default-members = ["crates/r8d", "crates/r8-gui"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["mbs"]

[workspace.dependencies]
r8-core = { path = "crates/r8-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
evdev = { version = "0.13", features = ["tokio"] }
nix = { version = "0.29", features = ["ioctl", "fs"] }
eframe = { version = "0.31", default-features = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
